name: ci
on:
  push:
    branches: [main]
  pull_request:
  # release.yml calls this workflow, so a release ships only a tree that passed it.
  workflow_call:
permissions:
  contents: read
env:
  BUN_VERSION: 1.3.14
  NODE_VERSION: "24"
  # The opencode release the smoke test and integration suite run against.
  OPENCODE_VERSION: 1.18.34
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Package contents
        run: npm pack --dry-run

  opencode:
    name: smoke + integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Install opencode
        run: |
          npm install -g "opencode-ai@${OPENCODE_VERSION}"
          test "$(opencode --version)" = "${OPENCODE_VERSION}"
      # smoke.sh runs npm offline; an online install of the packed tarball fills the cache.
      - name: Warm npm cache
        run: |
          work=$(mktemp -d)
          npm pack --pack-destination "$work"
          cd "$work"
          echo '{"private":true}' > package.json
          npm install --no-audit --no-fund --ignore-scripts ./*.tgz
      - name: Smoke test
        run: bash scripts/smoke.sh --strict
      - name: Integration suite
        run: bun run test:e2e
